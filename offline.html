<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão — Allira</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 360px; }
    .icon {
      width: 80px; height: 80px;
      background: #1a1a2e;
      border: 2px solid #3a2a5e;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #c8b8ff; }
    p { color: #7070a0; line-height: 1.65; margin-bottom: 2rem; font-size: 0.95rem; }
    button {
      background: linear-gradient(135deg, #7c5cbf, #5a3a9f);
      color: white; border: none;
      padding: 0.875rem 2.5rem;
      border-radius: 10px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; width: 100%;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar. Verifique sua conexão com a internet e tente novamente.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
