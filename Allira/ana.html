<style>
:root{
  --azul:#1B2A6B;--azul-mid:#243580;
  --rosa:#C9748A;--rosa-light:#e8a0b0;--rosa-pale:#f0c8d4;
  --rosa-bg:rgba(201,116,138,.07);
  --creme:#F5F0EB;--dark:#0D1225;--dark-card:#111827;
  --white:#FFFFFF;
  --border:rgba(201,116,138,.18);--border-dim:rgba(201,116,138,.09);
  --text-dim:rgba(245,240,235,.45);--text-mid:rgba(245,240,235,.7);
  --ok:#4ade80;--nok:#f87171;--warn:#fbbf24;
  --input-bg:rgba(27,42,107,.12);--input-focus:rgba(201,116,138,.2);
  --gold:#D4AF37;--gold-light:#F0D060;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;height:100%;}
body{
  background:var(--dark);color:var(--creme);
  font-family:'Montserrat',sans-serif;font-weight:300;
  height:100dvh;overflow:hidden;display:flex;flex-direction:column;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;opacity:.3;
}
::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--rosa);}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:.6;}}
@keyframes ncTyping{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}

/* ── HEADER ── */
header{
  position:relative;z-index:10;
  padding:12px 18px;
  background:rgba(13,18,37,.95);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-dim);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.logo{text-decoration:none;display:flex;align-items:center;height:34px;}
.logo-img{height:34px;width:auto;object-fit:contain;filter:brightness(1.1) drop-shadow(0 1px 6px rgba(201,116,138,.3));display:block;}
.logo-fallback{display:none;font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:500;letter-spacing:.15em;color:var(--creme);}
.logo-fallback span{color:var(--rosa);}
.logo-img[data-failed="true"]~.logo-fallback{display:block;}
.header-tag{font-size:.5rem;letter-spacing:.32em;text-transform:uppercase;color:var(--text-dim);}

/* ── CHAT AGENT HERO ── */
.agent-hero{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 18px 14px;
  background:linear-gradient(180deg,rgba(27,42,107,.18) 0%,transparent 100%);
  border-bottom:1px solid var(--border-dim);
  position:relative;z-index:1;
  animation:fadeUp .5s ease both;
}
.agent-avatar-wrap{position:relative;margin-bottom:10px;}
.agent-avatar{
  width:64px;height:64px;border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(201,116,138,.45);
  box-shadow:0 0 0 5px rgba(201,116,138,.08),0 12px 32px rgba(13,18,37,.6);
  display:block;
  background:linear-gradient(135deg,var(--rosa),var(--azul));
}
.agent-online-dot{
  width:12px;height:12px;border-radius:50%;
  background:var(--ok);border:2px solid var(--dark);
  position:absolute;bottom:2px;right:2px;
  animation:pulseDot 2s ease infinite;
}
.agent-eyebrow{
  font-size:.5rem;letter-spacing:.38em;text-transform:uppercase;
  color:var(--rosa);margin-bottom:5px;
  display:flex;align-items:center;gap:8px;
}
.agent-eyebrow::before,.agent-eyebrow::after{content:'';width:16px;height:1px;background:var(--rosa);opacity:.6;}
.agent-name{
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;font-weight:500;color:var(--creme);
  line-height:1;margin-bottom:5px;
}
.agent-status{
  display:flex;align-items:center;gap:5px;
  font-size:.52rem;letter-spacing:.1em;color:var(--ok);
}
.agent-status-dot{
  width:5px;height:5px;border-radius:50%;background:var(--ok);
  animation:pulseDot 2s ease infinite;flex-shrink:0;
}
.agent-desc{
  font-size:.6rem;color:var(--text-dim);letter-spacing:.04em;
  line-height:1.65;text-align:center;margin-top:7px;
  max-width:280px;
}

/* ── MESSAGES ── */
.chat-messages{
  flex:1;overflow-y:auto;
  padding:16px 14px 10px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
  position:relative;z-index:1;
}
.chat-messages::-webkit-scrollbar{width:2px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);}

/* bubbles */
.nc-bubble{
  max-width:82%;display:flex;flex-direction:column;gap:3px;
  animation:fadeUp .25s ease;
}
.nc-bubble.user{align-self:flex-end;}

/* WhatsApp-style bot row: avatar + name + bubble */
.nc-bubble.bot{
  align-self:flex-start;
  flex-direction:row;align-items:flex-end;gap:8px;max-width:88%;
}
.bot-avatar{
  width:30px;height:30px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  border:1px solid rgba(201,116,138,.35);
  background:linear-gradient(135deg,var(--rosa),var(--azul));
  align-self:flex-end;
}
.bot-content{
  display:flex;flex-direction:column;gap:2px;
  flex:1;min-width:0;
}
.bot-name{
  font-size:.5rem;letter-spacing:.1em;color:var(--rosa);
  font-weight:500;padding-left:2px;text-transform:uppercase;
}
.nc-bubble-text{
  padding:10px 13px;border-radius:16px;
  font-size:.74rem;line-height:1.8;letter-spacing:.02em;
  word-break:break-word;overflow-wrap:anywhere;
}
.nc-bubble-text a{color:#d4a0b0;font-weight:600;text-decoration:underline;word-break:break-all;}
.nc-bubble-text a.nc-wpp{
  display:inline-flex;align-items:center;gap:4px;
  background:#25D366;color:#fff;text-decoration:none;
  font-weight:600;padding:3px 10px;border-radius:20px;
  font-size:.65rem;margin-top:2px;
}
.nc-bubble-text strong{font-weight:700;}
.nc-bubble.bot .nc-bubble-text{
  background:rgba(27,42,107,.35);border:1px solid rgba(27,42,107,.5);
  border-bottom-left-radius:5px;color:var(--creme);
}
.nc-bubble.user .nc-bubble-text{
  background:linear-gradient(135deg,var(--azul),rgba(201,116,138,.6));
  border:1px solid rgba(201,116,138,.25);
  border-bottom-right-radius:5px;color:var(--white);
}
.nc-bubble-time{
  font-size:.47rem;letter-spacing:.08em;color:var(--text-dim);padding:0 4px;
}
.nc-bubble.user .nc-bubble-time{text-align:right;}

/* typing */
.nc-typing{
  display:none;align-self:flex-start;max-width:88%;
  animation:fadeUp .25s ease;
  flex-direction:row;align-items:flex-end;gap:8px;
}
.nc-typing.show{display:flex;}
.nc-typing-inner{
  background:rgba(27,42,107,.35);border:1px solid rgba(27,42,107,.5);
  border-bottom-left-radius:5px;border-radius:16px;
  padding:12px 16px;display:flex;align-items:center;gap:4px;
}
.nc-typing-dot{
  width:5px;height:5px;border-radius:50%;background:rgba(201,116,138,.7);
  animation:ncTyping 1.2s ease infinite;
}
.nc-typing-dot:nth-child(2){animation-delay:.2s;}
.nc-typing-dot:nth-child(3){animation-delay:.4s;}

/* ── DISCLAIMER ── */
.nc-disclaimer{
  flex-shrink:0;
  padding:6px 14px 7px;
  font-size:.48rem;letter-spacing:.04em;
  color:var(--text-dim);text-align:center;line-height:1.5;
  border-top:1px solid var(--border-dim);
  background:rgba(13,18,37,.4);
  position:relative;z-index:1;
}

/* ── INPUT AREA ── */
.nc-input-area{
  flex-shrink:0;
  padding:10px 14px 14px;
  border-top:1px solid var(--border-dim);
  display:flex;align-items:flex-end;gap:8px;
  background:rgba(13,18,37,.75);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:relative;z-index:1;
}
.nc-input{
  flex:1;background:rgba(27,42,107,.15);
  border:1px solid var(--border-dim);border-radius:14px;
  padding:11px 14px;
  font-family:'Montserrat',sans-serif;font-size:.74rem;font-weight:300;
  color:var(--creme);outline:none;resize:none;
  line-height:1.5;max-height:90px;overflow-y:auto;
  transition:border-color .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.nc-input::placeholder{color:var(--text-dim);font-size:.68rem;}
.nc-input:focus{border-color:rgba(201,116,138,.4);box-shadow:0 0 0 3px rgba(201,116,138,.08);}
.nc-send{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--azul),var(--rosa));
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;
  box-shadow:0 4px 14px rgba(201,116,138,.3);
}
.nc-send:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(201,116,138,.45);}
.nc-send:active{transform:translateY(0);}
.nc-send:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.nc-send svg{width:15px;height:15px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* quick replies */
.quick-replies{
  flex-shrink:0;
  padding:8px 14px 0;
  display:flex;gap:7px;overflow-x:auto;
  scrollbar-width:none;
  position:relative;z-index:1;
}
.quick-replies::-webkit-scrollbar{display:none;}
.qr-chip{
  flex-shrink:0;
  background:rgba(27,42,107,.2);border:1px solid var(--border-dim);
  border-radius:20px;padding:6px 13px;
  font-family:'Montserrat',sans-serif;font-size:.58rem;
  letter-spacing:.06em;color:var(--text-mid);
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.qr-chip:hover{background:rgba(201,116,138,.15);border-color:var(--border);color:var(--creme);}
.qr-chip:active{transform:scale(.97);}

@media(min-width:560px){
  header,main{max-width:560px;margin:0 auto;width:100%;}
  body{align-items:center;}
  body::before{display:none;}
}
@media(min-width:560px){
  body{background:linear-gradient(135deg,#0a0f1e 0%,#0d1225 60%,#120d1e 100%);}
}
</style>

let chatHistory = [];
let welcomed = false;

// ── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('chat-input').focus();
  setTimeout(() => {
    showTyping(true);
    setTimeout(() => {
      showTyping(false);
      addBubble('Olá! Sou a **Ana**, sua assistente virtual da Állira. 🌸\n\nEstou aqui para tirar suas dúvidas sobre procedimentos, cuidados pós-procedimento e muito mais.\n\nComo posso te ajudar hoje?', 'bot');

    }, 1400);
  }, 500);
});

// ── HELPERS ──────────────────────────────────────────────────────────────────
function getTime(){
  return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function renderText(raw){
  let s = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(https?:\/\/wa\.me\/\S+)/g,'<a href="$1" target="_blank" rel="noopener" class="nc-wpp">&#128241; WhatsApp Állira</a>');
  s = s.replace(/(https?:\/\/(?!wa\.me)\S+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.split('\n').join('<br>');
  return s;
}

function addBubble(text, role){
  const msgs = document.getElementById('chat-msgs');
  const wrap = document.createElement('div');
  wrap.className = 'nc-bubble ' + role;

  if(role === 'bot'){
    // WhatsApp-style: avatar on left, then name+bubble+time stacked
    const avatar = document.createElement('img');
    avatar.className = 'bot-avatar';
    avatar.src = 'https://lh3.googleusercontent.com/d/1CRfSTPM33C9BopCuH--jdYDoblclWvfX';
    avatar.alt = 'Ana';
    avatar.onerror = function(){ this.style.display='none'; };

    const content = document.createElement('div');
    content.className = 'bot-content';

    const nameEl = document.createElement('div');
    nameEl.className = 'bot-name';
    nameEl.textContent = 'Ana';

    const bubble = document.createElement('div');
    bubble.className = 'nc-bubble-text';
    bubble.innerHTML = renderText(text);

    const time = document.createElement('div');
    time.className = 'nc-bubble-time';
    time.textContent = getTime();

    content.appendChild(nameEl);
    content.appendChild(bubble);
    content.appendChild(time);
    wrap.appendChild(avatar);
    wrap.appendChild(content);
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'nc-bubble-text';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'nc-bubble-time';
    time.textContent = getTime();

    wrap.appendChild(bubble);
    wrap.appendChild(time);
  }

  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(show){
  document.getElementById('chat-typing').classList.toggle('show', show);
  const msgs = document.getElementById('chat-msgs');
  msgs.scrollTop = msgs.scrollHeight;
}

function chatAutoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

function chatKeyDown(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    chatSend();
  }
}

function qrSend(el, text){
  // esconde quick replies após primeiro uso
  document.getElementById('quick-replies').style.display = 'none';
  const input = document.getElementById('chat-input');
  input.value = text;
  chatSend();
}

// ── SEND ─────────────────────────────────────────────────────────────────────
async function chatSend(){
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  const text = input.value.trim();
  if(!text) return;

  // esconde quick replies se ainda visível
  document.getElementById('quick-replies').style.display = 'none';

  addBubble(text, 'user');
  chatHistory.push({role:'user', content: text});
  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;

  showTyping(true);

  try {
    const contents = chatHistory
      .filter(m => m.role !== 'system')
      .slice(-10)
      .map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      }));

    const res = await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': ANINHA_API_KEY
        },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: ANINHA_SYSTEM }] },
          contents: contents,
          generationConfig: { maxOutputTokens: 500, temperature: 0.7 }
        })
      }
    );

    const data = await res.json();
    showTyping(false);

    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || null;
    if(reply){
      addBubble(reply, 'bot');
      chatHistory.push({role:'assistant', content: reply});
    } else {
      console.warn('[Aninha] Sem reply:', JSON.stringify(data));
      addBubble('Desculpe, não consegui processar sua mensagem agora. Tente novamente! 🙏', 'bot');
    }
  } catch(err) {
    showTyping(false);
    addBubble('Ops, tive um probleminha de conexão. Tente novamente em instantes. 🙏', 'bot');
    console.error('[Aninha] erro:', err);
  }

  btn.disabled = false;
  document.getElementById('chat-msgs').scrollTop = 99999;
  input.focus();
}
</script>
